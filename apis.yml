aid: rakam
name: rakam
description: >-
  Rakam is a warehouse-native product analytics platform that lets business and data
  teams build analytics interfaces without coding, operating directly on the data
  warehouse (Snowflake, BigQuery, Redshift, Postgres, ClickHouse) without moving or
  duplicating data. It models data as code via dbt-style recipes and a semantic layer,
  and offers segmentation, funnel, retention, flow, and SQL reporting plus embeddable
  dashboards. Rakam originated as an open-source event-collection API (the AGPL rakam-api
  Java server with Android, iOS, and JavaScript tracker SDKs) and now ships the
  no-code Rakam Data Platform; the company is joining LiveRamp. Surfaced as a portfolio
  company of 500 Global and enriched into the API Evangelist network.
